{% extends "base.html" %}
{% block title %}My account{% endblock %}
{% block body %}
<div class="auth" style="margin-top:2vh">
  <div class="card">
    <h1>Change password</h1>
    <p class="muted">{{ me.full_name }} · {{ me.username }}</p>
    <form method="post">{{ csrf() }}
      <div class="field"><label>Current password</label><input type="password" name="current" required autocomplete="current-password"></div>
      <div class="field"><label>New password</label><input type="password" name="new" required autocomplete="new-password"></div>
      <div class="field"><label>Confirm new password</label><input type="password" name="confirm" required autocomplete="new-password"></div>
      <button class="btn">Save password</button>
    </form>
  </div>
</div>
{% endblock %}
